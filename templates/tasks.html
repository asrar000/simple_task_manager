<!DOCTYPE html>
<html>
<head>
    <title>Tasks</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="container">

<h2>Tasks</h2>

<form method="get" class="filter">
    <select name="status">
        <option value="">All</option>
        <option value="todo">Todo</option>
        <option value="in_progress">In Progress</option>
        <option value="done">Done</option>
    </select>
    <button type="submit">Filter</button>
</form>

<table>
    <tr>
        <th>Title</th>
        <th>Status</th>
        <th>Due Date</th>
        <th>Action</th>
    </tr>

    {% for task in tasks %}
    <tr>
        <td>{{ task["title"] }}</td>
        <td>{{ task["status"] }}</td>
        <td>{{ task["due_date"] or "N/A" }}</td>
        <td>
            {% if task["status"] != "done" %}
            <a href="/tasks/done/{{ task['id'] }}">Mark Done</a>
            {% endif %}
        </td>
    </tr>
    {% endfor %}
</table>

</div>
</body>
</html>
